[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcgp-bot"
version = "0.1.0"
description = "Bot de reroll para Pokémon TCG Pocket com suporte a múltiplos dispositivos via ADB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3"]

[project.scripts]
ptcgp-bot = "ptcgp_bot.__main__:app"

[tool.setuptools.packages.find]
include = ["ptcgp_bot*"]

[tool.setuptools.package-data]
ptcgp_bot = ["vision/templates/*.png", "dashboard/templates/*.html", "dashboard/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
